name: Publish privacy policy

# Run explicitly after reviewing the policy and enabling GitHub Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: privacy-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public policy source
        run: |
          mkdir -p _privacy_source
          {
            printf '%s\n' '---' 'layout: default' 'title: Touchgrass Privacy Policy' '---' ''
            cat docs/chrome-web-store/privacy-policy.md
          } > _privacy_source/index.md
          printf '%s\n' 'title: Touchgrass' 'theme: jekyll-theme-primer' > _privacy_source/_config.yml
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./_privacy_source
          destination: ./_privacy_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_privacy_site
      - name: Deploy policy
        id: deployment
        uses: actions/deploy-pages@v4
